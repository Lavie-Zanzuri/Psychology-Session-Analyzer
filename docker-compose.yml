
services:
  # DataDog Agent
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
      - DD_TAGS=env:dev project:psychology-analyzer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - app-network
  # MinIO - Object Storage (like S3)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console UI port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:  
      com.datadoghq.ad.logs: '[{"source": "python", "service": "minio"}]'

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "RabbitMQ"}]'

  # Redis - for caching LLM calls 
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "redis"}]'

# Upload Service
  upload-service:
    build: ./services/upload-service
    container_name: upload-service
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: psychology-sessions
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
    depends_on:
      - minio
      - rabbitmq
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "upload-service"}]'

  #event-consumer: for testing only
    #build: ./services/event-consumer
    #container_name: event-consumer
    #environment:
      #RABBITMQ_HOST: rabbitmq
      ##RABBITMQ_PASS: admin
   # depends_on:
    #  - rabbitmq
    #networks:
    #  - app-network

# Audio Extractor Service
  audio-extractor:
    build: ./services/audio-extractor
    container_name: audio-extractor
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: psychology-sessions
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
    depends_on:
      - minio
      - rabbitmq
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "Extractor Service"}]'  

# Transcription Service
  transcription-service:
    build: ./services/transcription-service
    container_name: transcription-service
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: psychology-sessions
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
    depends_on:
      - minio
      - rabbitmq
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "transcription-service"}]'

  # Analysis Service
  analysis-service:
    build: ./services/analysis-service
    container_name: analysis-service
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: psychology-sessions
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongodb:27017/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - minio
      - rabbitmq
      - redis
      - mongodb
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "analysis-service"}]' 
  
  # API Service
  api-service:
    build: ./services/api-service
    container_name: api-service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "api-service"}]'       

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "mongodb", "service": "mongodb"}]'

volumes:
  minio_data:
  rabbitmq_data:
  redis_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge